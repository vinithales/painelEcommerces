name: bring-painel

x-app-environment: &app-environment
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:${APP_PORT:-8000}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-laravel}
  DB_USERNAME: laravel
  DB_PASSWORD: ${DB_PASSWORD:-laravel}
  QUEUE_CONNECTION: database
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025

services:
  app:
    build:
      context: .
    environment:
      <<: *app-environment
      WAIT_FOR_DB: "true"
      RUN_MIGRATIONS: "true"
      DEV_MODE: "true"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./:/var/www/html
      - app-vendor:/var/www/html/vendor
      - app-storage:/var/www/html/storage
      - app-cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  queue:
    build:
      context: .
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    environment:
      <<: *app-environment
      WAIT_FOR_DB: "true"
      DEV_MODE: "true"
    volumes:
      - ./:/var/www/html
      - app-vendor:/var/www/html/vendor
      - app-storage:/var/www/html/storage
      - app-cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_HMR_HOST: localhost
      VITE_HMR_PORT: ${VITE_PORT:-5173}
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
      - node-modules:/var/www/html/node_modules
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: laravel
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT_FORWARD:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  app-vendor:
  app-storage:
  app-cache:
  mysql-data:
  node-modules:
